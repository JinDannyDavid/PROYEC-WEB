
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jasspalian_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jasspalian_db
      MYSQL_USER: jass_user
      MYSQL_PASSWORD: JassPalian2024
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jasspalian_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./jasspalian_backend
    container_name: jasspalian_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=django-insecure-z4peu@df^km0lbs7+v#q8_t6c!*!mw7j^17-r*q4qh)u$%cii!
      - DB_NAME=jasspalian_db
      - DB_USER=jass_user
      - DB_PASSWORD=JassPalian2024
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=1
      - JASS_TARIFA_POR_M3=3.50
      - JASS_CARGO_FIJO_DEFAULT=25.00
      - JASS_CARGO_ALCANTARILLADO_DEFAULT=15.00
      - DB_WAIT_TIMEOUT=60
      - DB_WAIT_INTERVAL=2
    ports:
      - "8000:8000"
    networks:
      - jasspalian_network

  frontend:
    build: ./frontend
    container_name: jasspalian_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/api
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    networks:
      - jasspalian_network

volumes:
  mysql_data:

networks:
  jasspalian_network:
    driver: bridge